<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="220" r="160" fill="url(#glow)"/>

  <!-- Compass symbol -->
  <g transform="translate(256, 230)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.25"/>

    <!-- Cardinal marks -->
    <line x1="0" y1="-110" x2="0" y2="-120" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="110" x2="0" y2="120" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-110" y1="0" x2="-120" y2="0" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="0" x2="120" y2="0" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Needle North -->
    <polygon points="0,-85 16,-8 0,0 -16,-8" fill="url(#gold)" opacity="0.95"/>
    <!-- Needle South -->
    <polygon points="0,85 16,8 0,0 -16,8" fill="#e11d48" opacity="0.55"/>

    <!-- Center -->
    <circle cx="0" cy="0" r="7" fill="#d4a853"/>
    <circle cx="0" cy="0" r="3.5" fill="#0a0a0b"/>
  </g>

  <!-- ATLAS text -->
  <text x="256" y="410" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="48" letter-spacing="6" fill="url(#gold)">ATLAS</text>
</svg>
