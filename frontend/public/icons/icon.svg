<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- 磁铁图标 -->
  <g transform="translate(128, 96)">
    <!-- U形磁铁 -->
    <path d="M32 0 L32 160 C32 220 76 264 128 264 C180 264 224 220 224 160 L224 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="48" 
          stroke-linecap="round"/>
    
    <!-- 左极 (红色) -->
    <rect x="8" y="0" width="48" height="64" rx="8" fill="#ef4444"/>
    <text x="32" y="48" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">N</text>
    
    <!-- 右极 (蓝色) -->
    <rect x="200" y="0" width="48" height="64" rx="8" fill="#3b82f6"/>
    <text x="224" y="48" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">S</text>
  </g>
  
  <!-- 搜索图标 -->
  <g transform="translate(280, 280)">
    <circle cx="64" cy="64" r="48" fill="none" stroke="#ffffff" stroke-width="16"/>
    <line x1="100" y1="100" x2="140" y2="140" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
