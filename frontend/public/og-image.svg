<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#e11d48;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="roundClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#d4a853"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Decorative lines -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="30" x2="400" y2="30" stroke="url(#goldGrad)" stroke-width="1" opacity="0.1"/>

  <!-- Compass icon (left side) -->
  <g transform="translate(160, 315)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25"/>
    <line x1="0" y1="-90" x2="0" y2="-100" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="90" x2="0" y2="100" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-90" y1="0" x2="-100" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="0" x2="100" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="0,-70 14,-8 0,0 -14,-8" fill="url(#goldGrad)" opacity="0.9"/>
    <polygon points="0,70 14,8 0,0 -14,8" fill="#e11d48" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#d4a853"/>
    <circle cx="0" cy="0" r="3" fill="#0a0a0b"/>
  </g>

  <!-- Category icons row -->
  <g transform="translate(420, 430)" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#a8a29e" letter-spacing="2">
    <rect x="0" y="-18" width="80" height="28" rx="14" fill="none" stroke="#d4a853" stroke-width="1" opacity="0.4"/>
    <text x="40" y="0" text-anchor="middle" fill="#d4a853" opacity="0.8">JAV</text>

    <rect x="95" y="-18" width="100" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="145" y="0" text-anchor="middle" fill="#f59e0b" opacity="0.8">ANIME</text>

    <rect x="210" y="-18" width="90" height="28" rx="14" fill="none" stroke="#e11d48" stroke-width="1" opacity="0.4"/>
    <text x="255" y="0" text-anchor="middle" fill="#e11d48" opacity="0.8">MOVIE</text>

    <rect x="315" y="-18" width="100" height="28" rx="14" fill="none" stroke="#d4a853" stroke-width="1" opacity="0.4"/>
    <text x="365" y="0" text-anchor="middle" fill="#d4a853" opacity="0.8">MANGA</text>
  </g>

  <!-- Main title -->
  <text x="420" y="290" font-family="Sora, sans-serif" font-weight="800" font-size="80" letter-spacing="6" fill="url(#goldGrad)">ATLAS</text>

  <!-- Subtitle -->
  <text x="420" y="340" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="22" fill="#d6d3d1" letter-spacing="1">开源聚合搜索引擎</text>

  <!-- Description -->
  <text x="420" y="380" font-family="Plus Jakarta Sans, sans-serif" font-weight="400" font-size="16" fill="#78716c" letter-spacing="0.5">JAV / 动漫 / 影视 / 漫画/小说 — 一站式搜索</text>

  <!-- URL -->
  <text x="420" y="540" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="14" fill="#d4a853" opacity="0.6" letter-spacing="1">atlas.wort.uk</text>

  <!-- Decorative corner elements -->
  <g opacity="0.12">
    <line x1="1100" y1="60" x2="1160" y2="60" stroke="#d4a853" stroke-width="1.5"/>
    <line x1="1160" y1="60" x2="1160" y2="120" stroke="#d4a853" stroke-width="1.5"/>
  </g>
  <g opacity="0.12">
    <line x1="1100" y1="570" x2="1160" y2="570" stroke="#e11d48" stroke-width="1.5"/>
    <line x1="1160" y1="510" x2="1160" y2="570" stroke="#e11d48" stroke-width="1.5"/>
  </g>
</svg>
