<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <!-- Gold glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0"/>
    </radialGradient>
    <!-- Rose accent gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <!-- Clip for rounded corners -->
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#d4a853"/>
    </pattern>
    <rect width="512" height="512" fill="url(#dots)" clip-path="url(#roundClip)"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="256" cy="220" r="180" fill="url(#glowGrad)"/>

  <!-- Compass / Atlas symbol -->
  <g transform="translate(256, 230)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

    <!-- Cardinal direction marks -->
    <line x1="0" y1="-120" x2="0" y2="-130" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="120" x2="0" y2="130" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-120" y1="0" x2="-130" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="0" x2="130" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Diagonal marks -->
    <line x1="85" y1="-85" x2="92" y2="-92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="85" y1="85" x2="92" y2="92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-85" y1="85" x2="-92" y2="92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-85" y1="-85" x2="-92" y2="-92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Compass needle - North (gold) -->
    <polygon points="0,-95 18,-10 0,0 -18,-10" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Compass needle - South (rose) -->
    <polygon points="0,95 18,10 0,0 -18,10" fill="url(#roseGrad)" opacity="0.6"/>

    <!-- Center jewel -->
    <circle cx="0" cy="0" r="8" fill="#d4a853"/>
    <circle cx="0" cy="0" r="4" fill="#0a0a0b"/>

    <!-- Search magnifier accent (subtle, bottom-right) -->
    <g transform="translate(70, 70)" opacity="0.4">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <line x1="13" y1="13" x2="26" y2="26" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- "ATLAS" text -->
  <text x="256" y="420" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="52" letter-spacing="8" fill="url(#goldGrad)">ATLAS</text>

  <!-- Tagline -->
  <text x="256" y="450" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="400" font-size="14" letter-spacing="4" fill="#a8a29e" opacity="0.7">SEARCH ENGINE</text>
</svg>
