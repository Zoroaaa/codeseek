name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main, v3 ]
    paths: ['backend/**']
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要部署的分支'
        required: true
        default: 'v3'
        type: choice
        options:
          - main
          - v1
          - v2
          - v3
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Backend to ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (Monorepo Root)
        run: npm install

      - name: Type Check
        run: npm run typecheck --workspace=backend

      - name: Lint
        run: npm run lint --workspace=backend

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          command: deploy
        env:
          WRANGLER_VERSION: 4
      

